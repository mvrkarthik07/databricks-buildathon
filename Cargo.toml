[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
hashbrown = "0.17.1"
libc = "0.2.191"
memchr = "2.8.3"
parquet = { version = "60.0.0", default-features = false }
bytes = "1"
rustc-hash = "2.1.3"
serde_json = "1.0.154"

[features]
# Sub-phase timers and counters, printed to stderr. Off in the scored build.
prof = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
