# Manual only. Builds with the `prof` feature and prints the parse ladder, per-phase thread times
# and counters on x86-64. Timings are the runner's, never an official score.
name: x86-profile
on:
  workflow_dispatch:
    inputs:
      events:
        description: "Events in the dataset"
        default: "20000000"
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CPU
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|L1d|L2|L3"
          echo "flags: $(grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512[a-z_0-9]*|bmi2|popcnt)$' | sort -u | tr '\n' ' ')"
      - name: Build
        run: |
          cargo build --release --locked --features prof
          cp target/release/shopping-sessions /tmp/prof
          (cd generator && cargo build --release)
          generator/target/release/generate --seed 20261015 --events "${{ inputs.events }}" \
            --clicks $(( ${{ inputs.events }} / 4 )) --output /tmp/data
      - name: Parse ladder, one thread (CPU ns per row = diff between levels / rows)
        run: |
          NCPU=1 SS_LADDER=0 /tmp/prof /tmp/data /tmp/o >/dev/null 2>&1 || true   # warm the page cache
          for round in 1 2 3; do
            for l in 0 1 2 3 4 5 6; do
              rm -rf /tmp/o; mkdir /tmp/o
              echo "ladder $l round $round: $(NCPU=1 SS_LADDER=$l /tmp/prof /tmp/data /tmp/o 2>&1 | grep 'route_rows')"
            done
          done
      - name: Full pipeline, per-phase thread time (NCPU = cores)
        run: |
          for round in 1 2 3; do
            rm -rf /tmp/o; mkdir /tmp/o
            echo "== round $round"; NCPU=$(nproc) SS_TIMING=1 /tmp/prof /tmp/data /tmp/o 2>&1 | grep -E "PROF|wall"
          done
      - name: Full pipeline, one thread (no scheduling or memory-bandwidth contention)
        run: |
          rm -rf /tmp/o; mkdir /tmp/o
          NCPU=1 SS_TIMING=1 /tmp/prof /tmp/data /tmp/o 2>&1 | grep -E "PROF|wall"
