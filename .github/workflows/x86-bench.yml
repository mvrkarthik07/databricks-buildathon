# Manual only. Reports the runner's CPU, then checks correctness of this commit against the Python
# oracle and the base build, A/B-times it against BASE on x86-64, and measures memory on a large
# dataset. Runner times are for comparing builds on one runner, never an official score.
name: x86-bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to compare against (the scored build)"
        default: "0141e3d"
      events:
        description: "Events in the timing dataset"
        default: "20000000"
      mode:
        description: "bench (A/B timing and checks) or profile (prof-feature ladder and phase times)"
        default: "bench"
      big_events:
        description: "Events in the memory dataset (empty to skip)"
        default: "60000000"

jobs:
  bench:
    if: ${{ inputs.mode != 'profile' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CPU, memory, huge-page setting, disk
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|L2|L3"
          echo "flags: $(grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512[a-z_0-9]*|bmi2|popcnt)$' | sort -u | tr '\n' ' ')"
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          free -m | head -2; df -h / | tail -1
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r ref/requirements.txt
      - name: Build this commit and the base
        run: |
          cargo build --release --locked
          cp target/release/shopping-sessions /tmp/new
          git worktree add /tmp/basetree "${{ inputs.base }}"
          (cd /tmp/basetree && cargo build --release --locked && cp target/release/shopping-sessions /tmp/base)
          (cd generator && cargo build --release)
          printf '#!/bin/sh\nSS_THP=0 exec /tmp/new "$@"\n' > /tmp/new-thp0; chmod +x /tmp/new-thp0
      - name: Unit tests (include the allocator tests)
        run: cargo test --release --locked
      - name: Adversarial fixtures and the Python oracle, huge pages on and off, 1/3/8 workers
        # The 36 published fixtures sit in the git-ignored starter-duckdb/, so they are checked locally only.
        run: |
          for bin in /tmp/new /tmp/new-thp0; do
            echo "== $bin"
            make check-adversarial PYTHON=python3 REF=$bin | tail -1
          done
          for seed in 11 22 33 44; do
            generator/target/release/generate --seed $seed --events 200000 --clicks 50000 --output /tmp/small$seed
            python3 ref/reference.py /tmp/small$seed /tmp/oracle$seed > /dev/null
            for bin in /tmp/new /tmp/new-thp0; do
              for n in 1 3 8; do
                rm -rf /tmp/o; NCPU=$n $bin /tmp/small$seed /tmp/o
                python3 tools/diff.py /tmp/o /tmp/oracle$seed | grep -q '^MATCH' && echo "seed $seed $bin NCPU=$n: MATCH" || { echo "seed $seed $bin NCPU=$n: DIFFERENT"; exit 1; }
              done
            done
          done
      - name: Timing dataset and output equality with the base
        run: |
          generator/target/release/generate --seed 20261003 --events "${{ inputs.events }}" \
            --clicks $(( ${{ inputs.events }} / 4 )) --output /tmp/data
          /tmp/base /tmp/data /tmp/out-base
          for bin in /tmp/new /tmp/new-thp0; do
            rm -rf /tmp/out-new; $bin /tmp/data /tmp/out-new
            python3 tools/diff.py /tmp/out-new /tmp/out-base | tail -1 | sed "s|^|$bin vs base: |"
            python3 tools/diff.py /tmp/out-new /tmp/out-base | grep -q '^MATCH'
          done
      - name: Stage laps with CPU time (SS_TIMING), base and this commit
        run: |
          for r in 1 2; do
            for bin in /tmp/base /tmp/new; do
              echo "== $bin run $r"; rm -rf /tmp/o-lap; NCPU=$(nproc) SS_TIMING=1 $bin /tmp/data /tmp/o-lap 2>&1 | cut -c1-120
            done
          done
      - name: Interleaved timing (base, this commit, this commit with SS_THP=0)
        run: NCPU=$(nproc) python3 tools/ab.py /tmp/data 15 /tmp/base /tmp/new /tmp/new-thp0
      - name: Other seeds, 10M events, output equality and timing
        run: |
          for seed in 7 99; do
            generator/target/release/generate --seed $seed --events 10000000 --clicks 2500000 --output /tmp/x$seed
            /tmp/base /tmp/x$seed /tmp/o1; rm -rf /tmp/o2; /tmp/new /tmp/x$seed /tmp/o2
            python3 tools/diff.py /tmp/o2 /tmp/o1 | tail -1 | sed "s/^/seed $seed: /"; python3 tools/diff.py /tmp/o2 /tmp/o1 | grep -q '^MATCH'
            rm -rf /tmp/o1 /tmp/o2
            echo "== seed $seed"; NCPU=$(nproc) python3 tools/ab.py /tmp/x$seed 9 /tmp/base /tmp/new
          done
      - name: Large dataset, peak memory (24 GB limit)
        if: ${{ inputs.big_events != '' }}
        run: |
          rm -rf /tmp/data /tmp/x7 /tmp/x99 /tmp/out-base /tmp/out-new
          generator/target/release/generate --seed 20261003 --events "${{ inputs.big_events }}" \
            --clicks $(( ${{ inputs.big_events }} / 4 )) --output /tmp/big
          du -sh /tmp/big; df -h / | tail -1
          for bin in /tmp/base /tmp/new /tmp/new-thp0; do
            rm -rf /tmp/big-out-$(basename $bin)
            echo "== $bin"; NCPU=$(nproc) /usr/bin/time -v $bin /tmp/big /tmp/big-out-$(basename $bin) 2>&1 | grep -E "Maximum resident|Elapsed|Minor|Exit status"
          done
          for out in new new-thp0; do
            python3 tools/diff.py /tmp/big-out-$out /tmp/big-out-base | tail -1 | sed "s/^/60M $out vs base: /"
          done
  profile:
    if: ${{ inputs.mode == 'profile' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CPU
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|L1d|L2|L3"
          echo "flags: $(grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512[a-z_0-9]*|bmi2|popcnt)$' | sort -u | tr '\n' ' ')"
      - name: Build
        run: |
          cargo build --release --locked --features prof
          cp target/release/shopping-sessions /tmp/prof
          (cd generator && cargo build --release)
          generator/target/release/generate --seed 20261015 --events "${{ inputs.events }}" \
            --clicks $(( ${{ inputs.events }} / 4 )) --output /tmp/data
      - name: Splitter A/B, branch-free vs branchy quote trimming (ladder level 1, one thread)
        run: |
          cargo build --release --locked --features prof,branchy
          cp target/release/shopping-sessions /tmp/prof-branchy
          for round in 1 2 3 4 5; do
            for bin in /tmp/prof /tmp/prof-branchy; do
              rm -rf /tmp/o; mkdir /tmp/o
              echo "split L1 $bin round $round: $(NCPU=1 SS_LADDER=1 $bin /tmp/data /tmp/o 2>&1 | grep 'route_rows (')"
            done
          done
      - name: Parse ladder, one thread (CPU ns per row = diff between levels / rows)
        run: |
          NCPU=1 SS_LADDER=0 /tmp/prof /tmp/data /tmp/o >/dev/null 2>&1 || true   # warm the page cache
          for round in 1 2 3; do
            for l in 0 1 2 3 4 5 6; do
              rm -rf /tmp/o; mkdir /tmp/o
              echo "ladder $l round $round: $(NCPU=1 SS_LADDER=$l /tmp/prof /tmp/data /tmp/o 2>&1 | grep 'route_rows')"
            done
          done
      - name: Dedup survivor-routing ladder and click ladder, one thread
        run: |
          for round in 1 2; do
            for d in 0 1 99; do
              rm -rf /tmp/o; mkdir /tmp/o
              echo "dedup ladder $d round $round: $(NCPU=1 SS_DLADDER=$d /tmp/prof /tmp/data /tmp/o 2>&1 | grep -E 'PROF dedup: survivor' )"
            done
            for c in 1 2 3 4 5 99; do
              rm -rf /tmp/o; mkdir /tmp/o
              echo "click ladder $c round $round: $(NCPU=1 SS_CLADDER=$c /tmp/prof /tmp/data /tmp/o 2>&1 | grep -E 'PROF route_clicks' )"
            done
          done
      - name: Full pipeline, per-phase thread time (NCPU = cores)
        run: |
          for round in 1 2 3; do
            rm -rf /tmp/o; mkdir /tmp/o
            echo "== round $round"; NCPU=$(nproc) SS_TIMING=1 /tmp/prof /tmp/data /tmp/o 2>&1 | grep -E "PROF|wall"
          done
      - name: Full pipeline, one thread (no scheduling or memory-bandwidth contention)
        run: |
          rm -rf /tmp/o; mkdir /tmp/o
          NCPU=1 SS_TIMING=1 /tmp/prof /tmp/data /tmp/o 2>&1 | grep -E "PROF|wall"
