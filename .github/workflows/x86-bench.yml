# Manual only. Reports the runner's CPU flags first, so an AVX2 or AVX-512 result is never assumed,
# then checks correctness and A/B-times the current commit against BASE on x86-64.
name: x86-bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to compare against (the pre-optimization build)"
        default: "6c87438"
      events:
        description: "Events in the generated dataset"
        default: "20000000"
      only_micro:
        description: "false: full A/B vs base. true: only the route_rows shard microbenchmark. engine: v1 vs v2 engine comparison (SS_ENGINE)"
        default: "false"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CPU and memory
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|L2|L3"
          echo "flags: $(grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512[a-z_0-9]*|bmi2|popcnt)$' | sort -u | tr '\n' ' ')"
          free -m | head -2
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r ref/requirements.txt
      - name: Build current and base
        run: |
          cargo build --release --locked
          cp target/release/shopping-sessions /tmp/new
          if [ "${{ inputs.only_micro }}" != "true" ]; then
            git worktree add /tmp/basetree "${{ inputs.base }}"
            (cd /tmp/basetree && cargo build --release --locked && cp target/release/shopping-sessions /tmp/base)
          fi
          (cd generator && cargo build --release)
      - name: Unit tests, adversarial fixtures, Python oracle on fresh seeds
        if: ${{ inputs.only_micro == 'false' }}
        # The 36 published fixtures sit in the git-ignored starter-duckdb/, so they are checked locally only.
        run: |
          cargo test --release --locked
          make check-adversarial PYTHON=python3 REF=/tmp/new
          for seed in 11 22 33; do
            generator/target/release/generate --seed $seed --events 200000 --clicks 50000 --output /tmp/small$seed
            python3 ref/reference.py /tmp/small$seed /tmp/oracle$seed > /dev/null
            /tmp/new /tmp/small$seed /tmp/new$seed
            echo "seed $seed: $(python3 tools/diff.py /tmp/new$seed /tmp/oracle$seed | tail -1)"
            python3 tools/diff.py /tmp/new$seed /tmp/oracle$seed | grep -q '^MATCH'
          done
      - name: Dataset
        run: |
          generator/target/release/generate --seed 20261003 --events "${{ inputs.events }}" \
            --clicks $(( ${{ inputs.events }} / 4 )) --output /tmp/data
      - name: Output matches the base build
        if: ${{ inputs.only_micro == 'false' }}
        run: |
          /tmp/base /tmp/data /tmp/out-base
          /tmp/new /tmp/data /tmp/out-new
          python3 tools/diff.py /tmp/out-new /tmp/out-base | tail -3
      - name: Per-stage wall-clock laps of the current build (cumulative, last of 3 runs)
        if: ${{ inputs.only_micro == 'false' }}
        run: |
          for i in 1 2 3; do rm -rf /tmp/out-lap; NCPU=$(nproc) SS_TIMING=1 /tmp/new /tmp/data /tmp/out-lap 2> /tmp/laps.txt; done
          cat /tmp/laps.txt
          NCPU=$(nproc) /usr/bin/time -v /tmp/new /tmp/data /tmp/out-rss 2>&1 | grep -E "Maximum resident|Elapsed|Minor|Major" || true
      - name: Single-thread parse microbenchmark (ns per row, per component)
        if: ${{ inputs.only_micro == 'false' }}
        run: SS_BENCH=1 /tmp/new /tmp/data /tmp/out-bench 2>&1 | tail -12
      - name: Adaptive shards vs the scored count (output must match the base build)
        if: ${{ inputs.only_micro == 'false' }}
        run: |
          printf '#!/bin/sh\nSS_SHARDS=64 exec /tmp/new "$@"\n' > /tmp/new-s64; chmod +x /tmp/new-s64
          rm -rf /tmp/out-a; /tmp/new /tmp/data /tmp/out-a; python3 tools/diff.py /tmp/out-a /tmp/out-base | tail -1 | sed 's/^/adaptive: /'
          NCPU=$(nproc) python3 tools/ab.py /tmp/data 15 /tmp/new-s64 /tmp/new
      - name: Interleaved timing against the base build
        if: ${{ inputs.only_micro == 'false' }}
        run: |
          NCPU=$(nproc) python3 tools/ab.py /tmp/data 15 /tmp/base /tmp/new
      - name: route_rows ns/row by shard count (single thread)
        if: ${{ inputs.only_micro == 'true' }}
        run: |
          for n in 1 8 64 512 4096; do
            echo "== SS_SHARDS=$n"; SS_SHARDS=$n SS_BENCH=1 /tmp/new /tmp/data /tmp/o 2>&1 | grep -E "full route_rows|split \(rows:"
          done
      - name: Sampled profile of the whole pipeline (perf, cpu-clock, symbols)
        if: ${{ inputs.only_micro == 'true' }}
        run: |
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) > /dev/null 2>&1 || sudo apt-get install -y -q linux-tools-generic > /dev/null 2>&1 || true
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}; echo "perf: $PERF"
          NCPU=4 sudo -E $PERF record -F 1999 -e cpu-clock -o /tmp/perf.data /tmp/new /tmp/data /tmp/o-perf 2>&1 | tail -2
          sudo $PERF report -i /tmp/perf.data --no-children --sort sym --stdio 2>/dev/null | grep -v "^#" | grep -v "^$" | head -45 | cut -c1-150

      # ---- only_micro=engine: the v2 engine (src/v2.rs) against the generic engine, same binary ----
      - name: "engine: correctness of v2 (unit tests, adversarial, oracle seeds, worker counts)"
        if: ${{ inputs.only_micro == 'engine' }}
        run: |
          cargo test --release --locked
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          for cfg in "v2 0" "v3 0" "v1 1" "v3 1"; do
            set -- $cfg; export SS_ENGINE=$1; if [ "$2" = 1 ]; then export SS_THP=1; else unset SS_THP; fi
            echo "== engine $SS_ENGINE thp=$2"
            make check-adversarial PYTHON=python3 REF=/tmp/new | tail -1
            for seed in 11 22 33 44; do
              [ -d /tmp/small$seed ] || { generator/target/release/generate --seed $seed --events 200000 --clicks 50000 --output /tmp/small$seed; python3 ref/reference.py /tmp/small$seed /tmp/oracle$seed > /dev/null; }
              for n in 1 3 8; do
                rm -rf /tmp/new$seed; NCPU=$n /tmp/new /tmp/small$seed /tmp/new$seed
                python3 tools/diff.py /tmp/new$seed /tmp/oracle$seed | grep -q '^MATCH' && echo "seed $seed NCPU=$n: MATCH" || { echo "seed $seed NCPU=$n: DIFFERENT"; exit 1; }
              done
            done
          done
      - name: "engine: extra seeds, v2 output must equal the generic engine's"
        if: ${{ inputs.only_micro == 'engine' }}
        run: |
          for seed in 7 99; do
            generator/target/release/generate --seed $seed --events 10000000 --clicks 2500000 --output /tmp/x$seed
            rm -rf /tmp/o1; SS_ENGINE=v1 /tmp/new /tmp/x$seed /tmp/o1
            for cfg in "v2 0" "v3 0" "v3 1" "v1 1"; do
              set -- $cfg; rm -rf /tmp/o2
              if [ "$2" = 1 ]; then SS_ENGINE=$1 SS_THP=1 /tmp/new /tmp/x$seed /tmp/o2; else SS_ENGINE=$1 /tmp/new /tmp/x$seed /tmp/o2; fi
              python3 tools/diff.py /tmp/o2 /tmp/o1 | tail -1 | sed "s/^/seed $seed $1 thp=$2 vs v1: /"
              python3 tools/diff.py /tmp/o2 /tmp/o1 | grep -q '^MATCH'
            done
          done
          rm -rf /tmp/o1; /tmp/base /tmp/data /tmp/o1
          for cfg in "v2 0" "v3 0" "v3 1"; do
            set -- $cfg; rm -rf /tmp/o2; if [ "$2" = 1 ]; then export SS_THP=1; else unset SS_THP; fi
            SS_ENGINE=$1 /tmp/new /tmp/data /tmp/o2
            python3 tools/diff.py /tmp/o2 /tmp/o1 | tail -1 | sed "s/^/20M $1 thp=$2 vs scored build: /"
            python3 tools/diff.py /tmp/o2 /tmp/o1 | grep -q '^MATCH'
          done; unset SS_THP
      - name: "engine: stage laps and thread-ms, v1 then v2 (last of 3)"
        if: ${{ inputs.only_micro == 'engine' }}
        run: |
          for e in v1 v2 v3; do
            for i in 1 2 3; do rm -rf /tmp/out-lap; NCPU=$(nproc) SS_ENGINE=$e SS_TIMING=1 /tmp/new /tmp/data /tmp/out-lap 2> /tmp/laps-$e.txt; done
            echo "== $e"; cat /tmp/laps-$e.txt
            NCPU=$(nproc) SS_ENGINE=$e /usr/bin/time -v /tmp/new /tmp/data /tmp/out-rss 2>&1 | grep -E "Maximum resident|Elapsed|Minor|Voluntary|Involuntary" || true
          done
      - name: "engine: hardware counters (cycles, instructions, cache misses) if the VM exposes them"
        if: ${{ inputs.only_micro == 'engine' }}
        run: |
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) > /dev/null 2>&1 || sudo apt-get install -y -q linux-tools-generic > /dev/null 2>&1 || true
          sudo sysctl -q kernel.perf_event_paranoid=-1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          for e in v1 v2 v3; do
            echo "== $e"; NCPU=$(nproc) SS_ENGINE=$e sudo -E $PERF stat -e task-clock,cycles,instructions,cache-misses,cache-references,page-faults /tmp/new /tmp/data /tmp/o-perf 2>&1 | grep -E "task-clock|cycles|instructions|cache|page-faults|not supported|elapsed" || true
          done
      - name: "engine: interleaved A/B (scored build, generic engine, v2), 20M events"
        if: ${{ inputs.only_micro == 'engine' }}
        run: |
          printf '#!/bin/sh\nSS_ENGINE=v1 exec /tmp/new "$@"\n' > /tmp/new-v1; printf '#!/bin/sh\nSS_ENGINE=v2 exec /tmp/new "$@"\n' > /tmp/new-v2; printf '#!/bin/sh\nSS_ENGINE=v3 exec /tmp/new "$@"\n' > /tmp/new-v3; printf '#!/bin/sh\nSS_THP=1 SS_ENGINE=v1 exec /tmp/new "$@"\n' > /tmp/new-v1t; printf '#!/bin/sh\nSS_THP=1 SS_ENGINE=v3 exec /tmp/new "$@"\n' > /tmp/new-v3t; chmod +x /tmp/new-v1 /tmp/new-v2 /tmp/new-v3 /tmp/new-v1t /tmp/new-v3t
          NCPU=$(nproc) python3 tools/ab.py /tmp/data 13 /tmp/base /tmp/new-v1 /tmp/new-v1t /tmp/new-v2 /tmp/new-v3 /tmp/new-v3t
      - name: "engine: interleaved A/B on the extra seeds"
        if: ${{ inputs.only_micro == 'engine' }}
        run: |
          for seed in 7 99; do echo "== seed $seed (10M)"; NCPU=$(nproc) python3 tools/ab.py /tmp/x$seed 9 /tmp/new-v1 /tmp/new-v1t /tmp/new-v2 /tmp/new-v3; done
